name: checks

# The lint and the fast test suites, on every pull request and every push to main: Linux on the oldest
# Python Handoff supports, and Windows, where it's used most. GitHub Actions is free for
# public repositories. The full run (installers on several systems, macOS, the live worker
# sandbox tests) stays in tests.yml, started by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops its older run; every commit on main keeps its own result.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  macos:
    # The parts that work differently on a Mac, on every pull request: the worker's sandbox-exec profile and
    # stopping what a run left behind (sysctl instead of /proc). The live attack tests with the real agents
    # stay in tests.yml (worker-macos-live), started by hand.
    name: pytest (macos-latest, sandbox and processes)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs tests/test_sandbox.py tests/test_proc.py
