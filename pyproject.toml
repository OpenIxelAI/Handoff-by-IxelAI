[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-by-ixelai"
dynamic = ["version"]
description = "Let Claude and Codex work as partners on one project through a shared task board."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "mcp>=2.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "handoff.__version__" }

[tool.setuptools.packages.find]
include = ["handoff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]  # a tool's own worktrees, when it works inside the checkout

[tool.ruff.lint]
# Errors and warnings pycodestyle and pyflakes find (E, F, W), the bugbear checks for likely mistakes (B), and
# sorted imports (I). `ruff check .` runs in CI (checks.yml); `ruff check --fix .` sorts imports for you.
select = ["E", "F", "W", "B", "I"]
