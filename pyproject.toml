[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-by-ixelai"
dynamic = ["version"]
description = "Let Claude and Codex work as partners on one project through a shared task board."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "mcp>=2.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "handoff.__version__" }

[tool.setuptools.packages.find]
include = ["handoff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
